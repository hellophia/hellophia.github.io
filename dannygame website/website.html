<html>

<head>
	<style>
		
		@import url('https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap');
		
		body{
			background-color:#e3e3e3;
			font-family: Noto Serif;
		}
		
		h1{
			background-color:#212121;
			font-family: Arvo;
			color:#d6d4b8;
			text-align: center;
			font-size:120px;
			  padding: 20px;
			  box-shadow:
				0 0 0 10px #66208f,
			    0 0 0 20px #53a1b9,
			    0 0 0 30px #f4955c,
			    0 0 0 40px #c2e373;

			  margin: 80px;
		}
		
		h2{
			text-align:center;
			margin:-50px;
			padding:0px;
			font-size:120px;
		}
		
		.entry{
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 10px;
			margin: 40px auto;
		}
		
		input,
		textarea,
		button,
		select {
		  font-family: inherit;
		}
		
		textarea {
		  resize: none; /* optional */
		  height: 2.5em;
		}
		
	</style>
</head>

<body>
	
	<div><h1>DANNY'S WEBSITE</h1>
	
	<h2>🎮🐇</h2>
</div>
	
	<div class="entry">
	<p>what is your idea for a videogame?</p>
	
	<input id="name" placeholder="your name" />
	<textarea id="message" maxlength="280" placeholder="your idea here..."></textarea>
	<select id="emoji">
	  <option>🎮</option>
	  <option>😉</option>
	  <option>🥸</option>
	  <option>🙂</option>
	  <option>🍕</option>
	  <option>🍄‍</option>
	  <option>🌀</option>
	</select>
	<button id="postButton">post your idea</button>

</div>
	<hr>
	<div id="posts"></div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script>
		const SUPABASE_URL = "https://iqpnhitazpnolwexyhdl.supabase.co"
		const SUPABASE_ANON_KEY = "sb_publishable_ZzINcS2Yp72XIzWf1m28LQ_n1YEdOwP"

		const { createClient } = supabase
		const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

		async function submitPost() {
		  const name = document.getElementById("name").value
		  const message = document.getElementById("message").value
		  const emoji = document.getElementById("emoji").value

		  if (!name || !message) {
		    alert("Please enter name and message")
		    return
		  }

		  const { error } = await client
		    .from("posts")
		    .insert([{ name, message, emoji }])

		  if (error) {
		    alert("Error posting: " + error.message)
		  } else {
		    document.getElementById("message").value = ""
		    loadPosts()
		  }
		}

		async function loadPosts() {
		  const { data, error } = await client
		    .from("posts")
		    .select("*")
		    .order("created_at", { ascending: false })

		  if (error) {
		    console.error(error)
		    return
		  }

		  const postsDiv = document.getElementById("posts")
		  postsDiv.innerHTML = ""

		  data.forEach(post => {
		    const div = document.createElement("div")
		    div.innerHTML = `
		      <strong>${post.name}</strong> ${post.emoji}<br>
		      ${post.message}
		      <hr>
		    `
		    postsDiv.appendChild(div)
		  })
		}

		loadPosts()
		
document
  .getElementById("postButton")
  .addEventListener("click", submitPost)
		
	</script>
	
</body>

</html>
