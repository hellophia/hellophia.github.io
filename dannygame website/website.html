<html>

<head>
	<style>
		
		.body{
			background-color:white;
		}
		
		h1{
			background-color:black;
			color:white;
			text-align: center;
			font-size:120px;
		}
		
		h2{
			text-align:center;
			margin:-50px;
			padding:0px;
			font-size:120px;
		}
		
		.entry{
		    display: flex;
		     justify-content: center;
		     align-items: center;
		}
		
	</style>
</head>

<body>
	
	<h1>DANNY'S WEBSITE</h1>
	
	<h2>🎮🐇</h2>
	
	<div class="entry">
	<p>what is your idea for a videogame?</p>
	
	<input id="name" placeholder="your name" />
	<textarea id="message" maxlength="280" placeholder="your idea here..."></textarea>
	<select id="emoji">
	  <option>🎮</option>
	  <option>😉</option>
	  <option>🥸</option>
	  <option>🙂</option>
	  <option>🍕</option>
	  <option>🍄‍</option>
	  <option>🌀</option>
	</select>
	<button id="postButton">post your idea</button>

</div>
	<hr>
	<div id="posts"></div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script>
		const SUPABASE_URL = "https://iqpnhitazpnolwexyhdl.supabase.co"
		const SUPABASE_ANON_KEY = "sb_publishable_ZzINcS2Yp72XIzWf1m28LQ_n1YEdOwP"

		const { createClient } = supabase
		const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

		async function submitPost() {
		  const name = document.getElementById("name").value
		  const message = document.getElementById("message").value
		  const emoji = document.getElementById("emoji").value

		  if (!name || !message) {
		    alert("Please enter name and message")
		    return
		  }

		  const { error } = await client
		    .from("posts")
		    .insert([{ name, message, emoji }])

		  if (error) {
		    alert("Error posting: " + error.message)
		  } else {
		    document.getElementById("message").value = ""
		    loadPosts()
		  }
		}

		async function loadPosts() {
		  const { data, error } = await client
		    .from("posts")
		    .select("*")
		    .order("created_at", { ascending: false })

		  if (error) {
		    console.error(error)
		    return
		  }

		  const postsDiv = document.getElementById("posts")
		  postsDiv.innerHTML = ""

		  data.forEach(post => {
		    const div = document.createElement("div")
		    div.innerHTML = `
		      <strong>${post.name}</strong> ${post.emoji}<br>
		      ${post.message}
		      <hr>
		    `
		    postsDiv.appendChild(div)
		  })
		}

		loadPosts()
		
document
  .getElementById("postButton")
  .addEventListener("click", submitPost)
		
	</script>
	
</body>

</html>
