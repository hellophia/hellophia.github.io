<html>

<head>
	<style>
		
		@import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
		
		body{
			background-color: #6475ab;
		}
		
		#container {
		  position: relative;
		  margin: 0;
		  padding: 0;
		}
		
		.center {
		  display: flex;
		    justify-content: center;
		    align-items: center;
		    height: 100vh;
		}
		.outer-border {
		  border: 2px solid black;
		  display: inline-block;
		  padding: 0px;
		}

		.middle-border {
		  border: 30px solid #aa885c;
		  padding: 0px;
		}

		.inner-border {
		  border: 2px solid black;
		  padding: 12px 28px;
		  background-color: #c2c0cc;
		  font-size: 66px;
		  font-family: "Rubik", sans-serif;
		  font-weight: 700;
		  letter-spacing:12px;
		  line-height:100px;
		  text-align: center;
		}
		.img-overlay {
		  position: absolute;
		}
		
	</style>
</head>

<body>
	
	<div id="container">
	<div class="center">
	  <div class="outer-border">
	    <div class="middle-border">
	      <div class="inner-border">
	        <div class="placard-text">
	          DON'T FORGET:<br>YOU'RE HERE<br>FOREVER.
	        </div>
	      </div>
	    </div>
	  </div>  
	</div>
	</div>
	
	<script>
	
		const imageSlots = [
		  { x: 40,  y: 20,  width: 100, aspect: "square" },
		  { x: 220, y: 10,  width: 120, aspect: "landscape" },
		  { x: 380, y: 30,  width: 90,  aspect: "portrait" },
		  // ... up to 11 entries
		];
	
	  fetch('images.json')
	    .then(res => res.json())
	    .then(images => {
	      const container = document.getElementById('container');
    
	      imageSlots.forEach((slot, i) => {
	        // Filter images that match the required aspect
	        const matches = images.filter(img => img.aspect === slot.aspect);
	        if (matches.length === 0) return; // no match, skip

	        // Randomly pick one that hasn't been used yet
	        const index = Math.floor(Math.random() * matches.length);
	        const selected = matches.splice(index, 1)[0]; // remove it to prevent reuse

	        // Create image
	        const img = document.createElement('img');
	        img.src = `imgs/${selected.filename}`;
	        img.classList.add('img-overlay');
	        img.style.width = `${slot.width}px`;
	        img.style.left = `${slot.x}px`;
	        img.style.top = `${slot.y}px`;

	        container.appendChild(img);
	      });
	    });
	
	</script>
	
</body>
</html>
