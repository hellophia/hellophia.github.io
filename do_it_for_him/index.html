<html>

<head>
	<style>
		
		#container {
		  position: relative;
		  width: 600px;
		  margin: 50px auto;
		}
		#placard {
		  background: #ffe;
		  border: 4px solid #000;
		  padding: 20px;
		  font-size: 24px;
		  text-align: center;
		  position: relative;
		}
		.img-overlay {
		  position: absolute;
		  width: 100px;
		  height: auto;
		  /* top and left set dynamically */
		}
		
	</style>
</head>

<body>
	
	<div id="container">
	  <div id="placard">Don't forget: you're here forever.</div>
	  
	</div>
	
	<script>
	fetch('images.json')
	  .then(res => res.json())
	  .then(images => {
	    const container = document.getElementById('container');
	    const shuffled = images.sort(() => 0.5 - Math.random()).slice(0, 11);

	    shuffled.forEach((imgData, i) => {
	      const img = document.createElement('img');
	      img.src = `img/${imgData.filename}`;
	      img.classList.add('img-overlay');
	      // Example position logic (you'll need to tune these)
	      img.style.top = `${20 + i * 10}px`;
	      img.style.left = `${30 + (i * 40) % 300}px`;
	      img.style.width = imgData.aspect === 'square' ? '100px' : '140px';
	      container.appendChild(img);
	    });
	  });
	</script>
	
</body>
</html>
