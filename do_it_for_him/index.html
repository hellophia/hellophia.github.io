<html>

<head>
	<style>
		
		@import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
		
		body{
			margin: 0;
			padding: 0;
			height: 100vh;
			background-color: #6475ab;
		}
		
		#container {
		  position: relative;
		  margin: 0;
		  padding: 0;
		  width: 1400px;
		  height: 800px;
		}
		
		.outer-border {
			position: relative;
			left:332px;
			top:198px;
		  border: 2px solid black;
		  display: inline-block;
		  padding: 0px;
		}

		.middle-border {
		  border: 30px solid #aa885c;
		  padding: 0px;
		}

		.inner-border {
		  border: 2px solid black;
		  padding: 12px 28px;
		  background-color: #c2c0cc;
		  font-size: 66px;
		  font-family: "Rubik", sans-serif;
		  font-weight: 700;
		  letter-spacing:12px;
		  line-height:100px;
		  text-align: center;
		}
		
		.img-overlay {
		  position: absolute;
		}
		
		.img-label {
		  position: absolute;
		  font-size: 14px;
		  color: white;
		  background: rgba(0, 0, 0, 0.6);
		  padding: 2px 5px;
		  border-radius: 3px;
		  font-family: sans-serif;
		  pointer-events: none;
		  z-index: 9999;
		}
		
	</style>
</head>

<body>
	
	<div id="container">
	  <div class="outer-border">
	    <div class="middle-border">
	      <div class="inner-border">
	        <div class="placard-text">
	          DON'T FORGET:<br>YOU'RE HIM&nbsp;<br>FOREVER.
	        </div>
	      </div>
	    </div>
	  </div>  
	</div>
	
	<script>
		
		const showDebugNumbers = false;
	
		const imageSlots = [
			{ slot: 1, x: 498,  y: 273,  width: 46, aspect: "square" },
			{ slot: 2, x: 595, y: 335,  width: 165, aspect: "landscape" },
			{ slot: 3, x: 1030, y: 530,  width: 300,  aspect: "portrait" },
			{ slot: 4, x: 950, y: 250,  width: 350, aspect: "landscape" },
			{ slot: 5, x: 840, y: 210,  width: 190, aspect: "landscape" },
			{ slot: 6, x: 410, y: 360,  width: 260, aspect: "landscape" },
			{ slot: 7, x: 100, y: 500,  width: 300,  aspect: "portrait" },
			{ slot: 8, x: 620, y: 430,  width: 300, aspect: "landscape" },
			{ slot: 9, x: 558,  y: 245,  width: 48, aspect: "square" },
			{ slot: 10, x: 370, y: -50,  width: 350, aspect: "landscape" },
			{ slot: 11, x: 800, y: -70,  width: 250, aspect: "landscape" },
		];
	
	  fetch('images.json')
	    .then(res => res.json())
	    .then(images => {
			let imagePool = [...images];
	      
		  	const container = document.getElementById('container');
    
	      imageSlots.forEach((slot, i) => {
			  const matches = imagePool.filter(img => img.aspect === slot.aspect);
			  if (matches.length === 0) return;

			  const chosen = matches[Math.floor(Math.random() * matches.length)];

			  imagePool = imagePool.filter(img => img.filename !== chosen.filename);

			  const img = document.createElement('img');
			  img.src = `imgs/${chosen.filename}`;
			  img.classList.add('img-overlay');
			  img.style.left = `${slot.x}px`;
			  img.style.top = `${slot.y}px`;
			  img.style.width = `${slot.width}px`;
			  document.getElementById('container').appendChild(img);

			  if (showDebugNumbers) {
			    const label = document.createElement('div');
			    label.textContent = slot.slot;
			    label.className = 'img-label';
			    label.style.left = `${slot.x}px`;
			    label.style.top = `${slot.y}px`;
			    document.getElementById('container').appendChild(label);
			  }
			
	      });
	    });
	
	</script>
	
</body>
</html>
