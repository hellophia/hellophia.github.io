<html>

<head>
	<style>
		
		@import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
		
		body{
			background-color: #6475ab;
		}
		
		#container {
		  position: relative;
		  margin: 0;
		  padding: 0;
		}
		
		.center {
		  display: flex;
		    justify-content: center;
		    align-items: center;
		    height: 100vh;
		}
		.outer-border {
		  border: 2px solid black;
		  display: inline-block;
		  padding: 0px;
		}

		.middle-border {
		  border: 30px solid #aa885c;
		  padding: 0px;
		}

		.inner-border {
		  border: 2px solid black;
		  padding: 12px 28px;
		  background-color: #c2c0cc;
		  font-size: 66px;
		  font-family: "Rubik", sans-serif;
		  font-weight: 700;
		  letter-spacing:12px;
		  line-height:100px;
		  text-align: center;
		}
		.img-overlay {
		  position: absolute;
		}
		
		.img-label {
		  position: absolute;
		  font-size: 14px;
		  color: white;
		  background: rgba(0, 0, 0, 0.6);
		  padding: 2px 5px;
		  border-radius: 3px;
		  font-family: sans-serif;
		  pointer-events: none;
		  z-index: 9999;
		}
		
		#debug-toggle {
		  position: fixed;
		  top: 10px;
		  left: 10px;
		  display: flex;
		  align-items: center;
		  background: rgba(255, 255, 255, 0.85);
		  padding: 6px 10px;
		  border: 1px solid #ccc;
		  border-radius: 5px;
		  font-family: sans-serif;
		  font-size: 14px;
		  z-index: 10000;
		}

		.label-text {
		  margin-left: 10px;
		}

/* The switch - the box around the slider */
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

/* Hide default HTML checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* The slider */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  -webkit-transition: .4s;
  transition: .4s;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  -webkit-transition: .4s;
  transition: .4s;
}

input:checked + .slider {
  background-color: #2196F3;
}

input:focus + .slider {
  box-shadow: 0 0 1px #2196F3;
}

input:checked + .slider:before {
  -webkit-transform: translateX(26px);
  -ms-transform: translateX(26px);
  transform: translateX(26px);
}

/* Rounded sliders */
.slider.round {
  border-radius: 34px;
}

.slider.round:before {
  border-radius: 50%;
}
		
	</style>
</head>

<body>
	
	<label class="switch">
	  <input type="checkbox">
	  <span class="slider round"></span>
	</label>
	
	<div id="container">
	<div class="center">
	  <div class="outer-border">
	    <div class="middle-border">
	      <div class="inner-border">
	        <div class="placard-text">
	          DON'T FORGET:<br>YOU'RE HERE<br>FOREVER.
	        </div>
	      </div>
	    </div>
	  </div>  
	</div>
	</div>
	
	<script>
		
		const showDebugNumbers = true;
	
		const imageSlots = [
		  { slot: 1, x: 490,  y: 265,  width: 48, aspect: "square" },
		  { slot: 2, x: 590, y: 335,  width: 145, aspect: "landscape" },
		  { slot: 3, x: 1000, y: 500,  width: 300,  aspect: "portrait" },
		  { slot: 4, x: 950, y: 220,  width: 350, aspect: "landscape" },
			{ slot: 5, x: 820, y: 200,  width: 190, aspect: "landscape" },
			{ slot: 6, x: 400, y: 350,  width: 300, aspect: "landscape" },
		];
	
	  fetch('images.json')
	    .then(res => res.json())
	    .then(images => {
			let imagePool = [...images];
	      
		  	const container = document.getElementById('container');
    
	      imageSlots.forEach((slot, i) => {
			  const matches = imagePool.filter(img => img.aspect === slot.aspect);
			  if (matches.length === 0) return;

			  const chosen = matches[Math.floor(Math.random() * matches.length)];

			  imagePool = imagePool.filter(img => img.filename !== chosen.filename);

			  const img = document.createElement('img');
			  img.src = `img/${chosen.filename}`;
			  img.classList.add('img-overlay');
			  img.style.left = `${slot.x}px`;
			  img.style.top = `${slot.y}px`;
			  img.style.width = `${slot.width}px`;
			  document.body.appendChild(img);

			  if (isDebugMode()) {
			    const label = document.createElement('div');
			    label.textContent = slot.slot;
			    label.className = 'img-label';
			    label.style.left = `${slot.x}px`;
			    label.style.top = `${slot.y}px`;
			    document.body.appendChild(label);
			  }
			
	      });
	    });
		
		function isDebugMode() {
		  return document.getElementById('showDebugToggle')?.checked;
		}

		document.getElementById('showDebugToggle').addEventListener('change', () => {
		  const show = isDebugMode();
		  document.querySelectorAll('.img-label').forEach(label => {
		    label.style.display = show ? 'block' : 'none';
		  });
		});
	
	</script>
	
</body>
</html>
