<html>

<head>
	<style>
		
		@import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
		
		body{
			background-color: #6475ab;
		}
		
		#container {
		  position: relative;
		  margin: 0;
		  padding: 0;
		}
		
		.center {
		  display: flex;
		    justify-content: center;
		    align-items: center;
		    height: 100vh;
		}
		.outer-border {
		  border: 2px solid black;
		  display: inline-block;
		  padding: 0px;
		}

		.middle-border {
		  border: 30px solid #aa885c;
		  padding: 0px;
		}

		.inner-border {
		  border: 2px solid black;
		  padding: 12px 28px;
		  background-color: #c2c0cc;
		  font-size: 66px;
		  font-family: "Rubik", sans-serif;
		  font-weight: 700;
		  letter-spacing:12px;
		  line-height:100px;
		  text-align: center;
		}
		.img-overlay {
		  position: absolute;
		}
		
		.img-label {
		  position: absolute;
		  font-size: 14px;
		  color: white;
		  background: rgba(0, 0, 0, 0.6);
		  padding: 2px 5px;
		  border-radius: 3px;
		  font-family: sans-serif;
		  pointer-events: none;
		  z-index: 9999;
		}
		
		#debug-toggle {
		  position: fixed;
		  top: 10px;
		  left: 10px;
		  background: rgba(255, 255, 255, 0.85);
		  padding: 6px 10px;
		  border: 1px solid #ccc;
		  border-radius: 5px;
		  font-family: sans-serif;
		  font-size: 14px;
		  z-index: 10000;
		}
		
		
	</style>
</head>

<body>
	
	<div id="debug-toggle">
	  <label>
	    <input type="checkbox" id="showDebugToggle" checked>
	    debug
	  </label>
	</div>
	
	<div id="container">
	<div class="center">
	  <div class="outer-border">
	    <div class="middle-border">
	      <div class="inner-border">
	        <div class="placard-text">
	          DON'T FORGET:<br>YOU'RE HERE<br>FOREVER.
	        </div>
	      </div>
	    </div>
	  </div>  
	</div>
	</div>
	
	<script>
		
		const showDebugNumbers = true;
	
		const imageSlots = [
		  { slot: 1, x: 491,  y: 265,  width: 48, aspect: "square" },
		  { slot: 2, x: 590, y: 335,  width: 145, aspect: "landscape" },
		  { slot: 3, x: 1000, y: 500,  width: 300,  aspect: "portrait" },
		  { slot: 4, x: 1000, y: 220,  width: 350, aspect: "landscape" },
			{ slot: 5, x: 850, y: 200,  width: 190, aspect: "landscape" },
			{ slot: 6, x: 500, y: 350,  width: 300, aspect: "landscape" },
		];
	
	  fetch('images.json')
	    .then(res => res.json())
	    .then(images => {
	      const container = document.getElementById('container');
    
	      imageSlots.forEach((slot, i) => {
	        // Filter images that match the required aspect
	        const matches = images.filter(img => img.aspect === slot.aspect);
	        if (matches.length === 0) return; // no match, skip

	        // Randomly pick one that hasn't been used yet
	        const index = Math.floor(Math.random() * matches.length);
	        const selected = matches.splice(index, 1)[0]; // remove it to prevent reuse

	        // Create image
	        const img = document.createElement('img');
	        img.src = `imgs/${selected.filename}`;
	        img.classList.add('img-overlay');
	        img.style.width = `${slot.width}px`;
	        img.style.left = `${slot.x}px`;
	        img.style.top = `${slot.y}px`;

	        container.appendChild(img);
			
			const debugCheckbox = document.getElementById('showDebugToggle');
			const isDebugMode = () => debugCheckbox?.checked;

			if (isDebugMode()) {
			  const label = document.createElement('div');
			  label.textContent = slot.slot;
			  label.className = 'img-label';
			  label.style.left = `${slot.x}px`;
			  label.style.top = `${slot.y}px`;
			  document.body.appendChild(label);
			}
			
	      });
	    });
		
		debugCheckbox.addEventListener('change', () => {
		  document.querySelectorAll('.img-label').forEach(label => {
		    label.style.display = debugCheckbox.checked ? 'block' : 'none';
		  });
		});
		
	
	</script>
	
</body>
</html>
