<html>

<head>
	<style>
		
		@import url('https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap');
		
		body {
		  background: #212121;
		  color: #dad7d3;
		  font-family: "Noto Serif", serif;
		  text-align: center;
		}

		.entry {
		  display: flex;
		  justify-content: center;
		  gap: 10px;
		  margin: 20px auto;
		}

		input, button {
		  font-family: inherit;
		  padding: 6px;
		}
		
		.progress-container {
		  width: 50ch;
		  margin: 0 auto;
		}

		@media (max-width: 600px) {
		  .progress-container {
		    width: 18ch;
		  }
		}
		
		.entry-header {
		  display: flex;
		  justify-content: space-between;
		  margin-bottom: 4px;
		  white-space: nowrap;
		}
		
		.ascii-bar {
		  font-family: monospace;
		  letter-spacing: 1px;
		  margin-top: 6px;
		}
		
		.bar-empty {
		  opacity: 0.5;
		}
		
		.month {
		  padding: 2px 6px;
		  color:#212121;
		}
		
	</style>
</head>

<body>
  <h1>𐡷 book club 𐡸</h1>
  
  <p><span class="month">February</span> – Grimmish by Michael Winkler</p>
  <p><span class="month">March</span> – ???? by ????</p>
  <p><span class="month">April</span> – ???? by ????</p>

  <div class="entry">
    <input id="name" placeholder="name">
    <input id="current" placeholder="current page">
    <input id="total" placeholder="total pages">
    <button id="postButton">submit</button>
  </div>
  <p style="font-style:italic">you can also enter timecodes for an audiobook in the format HH:MM, for example 0:12 / 3:45.</p>

  <div id="board"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
	  
	  const barColors = [
	    "#5d453e",
	    "#735a42",
	    "#deae5a",
	    "#ed841b",
	    "#c55d86",
		"#565e3c"
	  ]
	  
	  function colorMonths() {
	    const months = document.querySelectorAll("span.month")
	    let lastColor = null

	    months.forEach(month => {
	      let color
	      do {
	        color = barColors[Math.floor(Math.random() * barColors.length)]
	      } while (color === lastColor)

	      month.style.backgroundColor = color
	      lastColor = color
	    })
	  }
	  
	  function buildBar(percent) {

	    const width = window.matchMedia("(max-width: 600px)").matches
	      ? 18   // mobile width
	      : 50   // desktop width

	    const filled = Math.round((percent / 100) * width)
	    const empty = width - filled

	    const filledPart = "█".repeat(filled)
	    const emptyPart = `<span class="bar-empty">${"░".repeat(empty)}</span>`

	    return filledPart + emptyPart
	  }
	  
	  const SUPABASE_URL = "https://iqpnhitazpnolwexyhdl.supabase.co"
	  const SUPABASE_KEY = "sb_publishable_ZzINcS2Yp72XIzWf1m28LQ_n1YEdOwP"

	  const { createClient } = supabase
	  const client = createClient(SUPABASE_URL, SUPABASE_KEY)

	  async function submitProgress() {
	    const name = document.getElementById("name").value
	    const current_page = parseInt(document.getElementById("current").value)
	    const total_pages = parseInt(document.getElementById("total").value)

	    if (!name || !current_page || !total_pages) {
	      alert("Fill all fields")
	      return
	    }

	    const { data: existing } = await client
	      .from("book_progress")
	      .select("*")
	      .eq("name", name)
	      .single()

	    if (existing) {
	      await client
	        .from("book_progress")
	        .update({ current_page, total_pages, updated_at: new Date() })
	        .eq("name", name)
	    } else {
	      await client
	        .from("book_progress")
	        .insert([{ name, current_page, total_pages }])
	    }

	    loadBoard()
	  }

	  async function loadBoard() {
	    const { data } = await client
	      .from("book_progress")
	      .select("*")
	      .order("updated_at", { ascending: false })

	    const board = document.getElementById("board")
	    board.innerHTML = ""

	    data.forEach(entry => {
			
			const color = barColors[Math.floor(Math.random() * barColors.length)]
			
			const currentValue = parseProgress(entry.current_page)
			const totalValue = parseProgress(entry.total_pages)

			let percent = 0

			if (currentValue !== null && totalValue !== null && totalValue > 0) {
			  percent = Math.min((currentValue / totalValue) * 100, 100)
			}
			
			const bar = buildBar(percent)

	      const container = document.createElement("div")
	      container.className = "progress-container"

	      container.innerHTML = `
			<div class="entry-header">
			<span class="reader-name">${entry.name}</span>
			<span class="page-info">${entry.current_page}/${entry.total_pages}</span>
			</div>

	        <div class="ascii-bar" style="color: ${color};">${bar}</div>
	      `

	      board.appendChild(container)
	    })
	  }
	  
	  function parseProgress(value) {
	    if (!isNaN(value)) {
	      return parseFloat(value)
	    }

	    if (value.includes(":")) {
	      const parts = value.split(":").map(Number)

	      if (parts.length === 2) {
	        // mm:ss
	        return parts[0] * 60 + parts[1]
	      }

	      if (parts.length === 3) {
	        // hh:mm:ss
	        return parts[0] * 3600 + parts[1] * 60 + parts[2]
	      }
	    }

	    return null
	  }

	  loadBoard()
	  
	  colorMonths()
	  
document
  .getElementById("postButton")
  .addEventListener("click", submitProgress)
	
  </script>
</body>

</html>
