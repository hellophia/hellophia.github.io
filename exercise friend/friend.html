<!DOCTYPE html>
<html lang="en">
<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
	
	@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap');

	body {
		font-family: "Noto Serif";
		color: #303028;
		background-color: #e3e3e3;
		font-size: 16px;
		margin: 0px;
		padding: 0px;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.container {
		width: 50%;
		margin-top: 40px;
	}

	.accordion {
	}

	.accordion-header {
		padding: 8px;
	}

	.accordion-content {
		display: none;
		padding: 10px;
	}

	audio {
		color: #86aeaf;
		width: 100%;
	}
	audio::-webkit-media-controls-panel {
		background-color: #b0b4b4;
	}
	audio::-webkit-media-controls-enclosure {
		border-radius: 0;
	}

	input[type="checkbox"] {
		width: 20px;
		height: 20px;
		margin: 0px 6px;
		vertical-align: middle;
	}

	label {
		margin-left: 12px;
	}

	button {
		cursor: pointer;
	}
	
	.audiohelper {
		font-family: "Noto Serif";
		font-size: 18px;
		padding: 10px 30px;
		background-color: #d3c8c3;
		color: #404030;
		border: none;
		text-align: center;
		white-space: nowrap;
	}

	.triangle {
		margin: 0px 10px;
		display: inline-block;
		cursor: pointer;
	}
	
	.infotag {
		margin: 0px 8px;
	}

	.time {
		color: #b0b4b4;
	}

	.reps {
		color: #d4be96;
	}

	.sides {
		color: #dcb38b;
	}
	
	.grouptime {
		color: #6e7384;
	}

	#speakButton span {
		display: inline-block;
		animation: wave .75s infinite steps(1);
		//transform-origin: 50% 50%;
	}

	@keyframes wave {
		50% {
			transform: translatey(-4px);
		}
	}
	
	@media only screen and (max-width: 800px) {
		.container {
			width: 90%;
		}
	}
	
	.hkl{
		text-align: right;
		padding: 8px;
		background-color:#b0b4b4;
		margin: 20px 0;
	}
	
	</style>
	
</head>

<body>

	<div class="container">
		
		<div style="display:flex;">

			<button id="speakButton" class="audiohelper" onclick="speak()">⟶speak</button>

			<audio id="audio" controls>
			  your browser doesn't support the audio element.
			</audio>
		
		</div>
		
		<div class="hkl">
			<label for="hklbox">are you hkl?</label>
			<input type="checkbox" id="hklbox">
		 </div>
		 
 		<div class="hkl">
 			<label for="elobox">are you elo?</label>
 			<input type="checkbox" id="elobox">
 		 </div>

		<div id="stretchList">

		</div>

	</div>

<script>

	// are we hkl?
	let hkl = false;
	const hklbox = document.getElementById('hklbox');
	hklbox.addEventListener('change', function() {
		hkl = this.checked;
		if (hklbox.checked) elobox.checked = false;
	    console.log("hkl =", hkl);
	});
	
	// are we elo?
	let elo = false;
	const elobox = document.getElementById('elobox');
	elobox.addEventListener('change', function() {
		elo = this.checked;
		if (elobox.checked) hklbox.checked = false;
	    console.log("elo =", elo);
	});

	// randomizer
	function pickRandom(arr) {
	  return arr[Math.floor(Math.random() * arr.length)];
	}

	const intros = {
	  normal: {
	    s1: ["hey, here goes your exercise routine.", "hello, it's time to exercise.", "let's begin your workout routine."],
	    s2: ["hope you enjoy it.", "please do your very best.", "stay strong!"]
	  },
	  hkl: {
	    s1: ["what's up bitch.", "hello future sweaty little worm.", "hey there daddy."],
	    s2: ["welcome to the temple of pain.", "you are going to work out right this very minute.", "time to fucking work out."]
	  },
	  elo: {
	    s1: ["greetings noble eleanor.", "well well well, look who decided to do her physical therapy.", "welcome weary traveler."],
	    s2: ["you've made an excellent decision.", "your wisdom and perseverance are the envy of all.", "I am very impressed with your fastidiousness."]
	  }
	};

	const outros = {
	  normal: {
	    s1: ["your workout is all done.","you have completed your workout.","workout complete!"],
	    s2: ["go and live your life and have fun.","congratulations and good job.","what a success."],
	    s3: ["see you next time.","bye for now!","enjoy the rest of your day."]
	  },
	  hkl: {
	    s1: ["good job sweaty boy, you fucking killed it.","great job daddy.","you vanquished the fuck out of that routine."],
	    s2: ["ooh I'm so scared of your muscles.","you are growing ever more powerful.","damn you look strong."],
	    s3: ["see you next time, or else I'm going to haunt you.","if you don't return to the gym within seven days, a ghost is going to come out of the toilet while you pee.","you have satiated the gym demon... for now."]
	  },
	  elo: {
	    s1: ["you have completed your physical therapy.","thou hast completed your PT.","you are all done now!"],
	    s2: ["hip hip hooray.","oh you did such a good job.","what a tremendous accomplishment."],
	    s3: ["now you are free to spend the rest of your day basking in deep satisfaction.","you should feel very proud of yourself.","I applaud you and place a laurel wreath on your head."]
	  }
	};
	
	function generateIntro(mode) {
		const set = intros[mode];
	  return `${pickRandom(set.s1)} ${pickRandom(set.s2)}`;
	}

	function generateOutro(mode) {
	  const set = outros[mode];
	  return `${pickRandom(set.s1)} ${pickRandom(set.s2)} ${pickRandom(set.s3)}`;
	}

	// array of colors for the headers to cycle thru
	const lightcolors = ['#d3c8c3','#d3b690','#b9af2a','#b0b4b4','#d4be96','#dcb38b'];
	let currentIndex = 0;

	// fetch the data from the spreadsheet as json using opensheet
	fetch('https://opensheet.elk.sh/1osuWeLX42mewfnpqIbYoUMNgtGscNcouADfZRGOLQxc/exercises')
	    .then(response => {
	        if (!response.ok) {
	            throw new Error('network response error');
	        }
	        return response.json();
	    })
	    .then(data => {

	        const items = data;
			createElements(items);

	    })
	    .catch(error => {
	        console.error('data fetching error', error);
	    });

	// make the exercise groups and the exercises within them
	function createElements(data) {

		const stretchList = document.getElementById('stretchList');
		const groupCheckboxes = {};

		data.forEach(item => {

			const groupName = item.group;

			// if the exercise group header doesn't exist yet, make it
			if (groupCheckboxes[groupName] === undefined) {

				const accordion = document.createElement('div');
		        accordion.className = 'accordion';

				const header = document.createElement('div');
				header.className = 'accordion-header';

				const triangle = document.createElement('div');
				triangle.className = 'triangle';
				triangle.textContent = "▶";

				// when the triangle in the exercise group header is clicked, show or hide the content
				triangle.onclick = function() {
					toggleAccordion(header);
				};

				groupCheckboxes[groupName] = document.createElement('input');
				groupCheckboxes[groupName].type = 'checkbox';
				groupCheckboxes[groupName].checked = false;

				const groupLabel = document.createElement('label');
				groupLabel.textContent = groupName.replace(/_/g, ' ');

				// if the group header checkbox is checked or unchecked, make the children follow suit
			    groupCheckboxes[groupName].addEventListener('change', function() {
			      const nestedCheckboxes = stretchList.querySelectorAll(`input[type='checkbox'][data-group='${CSS.escape(groupName)}']`);
			      nestedCheckboxes.forEach(checkbox => {
			        checkbox.checked = this.checked;
			      });
			    });

				const content = document.createElement('div');
				content.className = 'accordion-content';

				header.appendChild(triangle);
				header.appendChild(groupCheckboxes[groupName]);
				header.appendChild(groupLabel);
				accordion.appendChild(header);
				accordion.appendChild(content);

				groupCheckboxes[groupName] = {
					accordion: accordion,
					content: content
				};

				stretchList.appendChild(accordion);

				// styling
			    header.style.backgroundColor = lightcolors[currentIndex];
			    currentIndex++;
			    if (currentIndex >= lightcolors.length) {
			        currentIndex = 0;
			    }

			}

			// make a checkbox for sub-exercises
			const stretchCheckbox = document.createElement('input');
			stretchCheckbox.type = 'checkbox';
			stretchCheckbox.checked = false;
			stretchCheckbox.dataset.group = groupName;
			stretchCheckbox.dataset.time = item.time;
			stretchCheckbox.dataset.bothsides = item.bothsides;
			stretchCheckbox.dataset.recover = item.recover;
			stretchCheckbox.dataset.reps = item.reps;

			const stretchLabel = document.createElement('label');
			stretchLabel.textContent = item.stretch;

			groupCheckboxes[groupName].content.appendChild(stretchCheckbox);
			groupCheckboxes[groupName].content.appendChild(stretchLabel);

			// add rep and time info
			if(item.reps > 1){
				const repspan = document.createElement('span');
				repspan.classList.add('reps', 'infotag');
				repspan.textContent = item.reps + ' reps';
				groupCheckboxes[groupName].content.appendChild(repspan);
			}
			else{
				const timeSpan = document.createElement('span');
				timeSpan.classList.add('time', 'infotag');
				timeSpan.textContent = item.time + ' seconds';
				groupCheckboxes[groupName].content.appendChild(timeSpan);
				if(item.bothsides === "y"){
					const sidesspan = document.createElement('span');
					sidesspan.classList.add('sides', 'infotag');
					sidesspan.textContent = 'per side';
					groupCheckboxes[groupName].content.appendChild(sidesspan);
				}
			}

			groupCheckboxes[groupName].content.appendChild(document.createElement('br'));

		});

		// total time estimation for exercise group headers
		for (let groupName in groupCheckboxes) {
            const checkboxes = groupCheckboxes[groupName].content.querySelectorAll("input[type='checkbox']");
            const filteredTextList = Array.from(checkboxes)
			let totalSeconds = estimateReadingTime(generatessml(filteredTextList));
			let minutes = Math.round(totalSeconds / 60);
			let seconds = Math.round(totalSeconds % 60);
			if (seconds < 10) {
			        seconds = '0' + seconds;
			    }

			const headerDiv = groupCheckboxes[groupName].accordion.querySelector(".accordion-header");
            const spanElement = document.createElement('span');
            spanElement.textContent = `${minutes}:${seconds}`;
			spanElement.classList.add('grouptime', 'infotag');
            headerDiv.appendChild(spanElement);
		}
	}

	// open and close the exercise group accordions
	function toggleAccordion(header) {
	  const content = header.nextElementSibling;
	  if (content.style.display === "block") {
	    content.style.display = "none";
		header.querySelector('.triangle').textContent = '▶';
	  } else {
	    content.style.display = "block";
		header.querySelector('.triangle').textContent = '▼';
	  }
	}

	// on click to speak,
	function speak() {

		//do the loading animation
		loadingText = "loading"
		var spannedText = loadingText.split('').map(letter => `<span>${letter}</span>`).join('');
		document.getElementById("speakButton").innerHTML = spannedText;
		const letters = document.querySelectorAll("#speakButton span");
		letters.forEach((letter, index) =>{
			letter.style.animationDelay = `${index * 0.1}s`;
		})

		// make array from checked non-group-header checkboxes
		var textList = document.querySelectorAll("#stretchList input[type='checkbox']");
		var filteredTextList = Array.from(textList).filter(checkbox => {
		    return checkbox.checked && checkbox.dataset.group !== undefined;
		});

		// make trial ssml from it
		var trialssml = generatessml(filteredTextList);
		
	    // check length and split if needed
		var ssmlParts = [];
	    if (trialssml.length > 4800) {
			console.log("splitting");
			const midpoint = Math.ceil(filteredTextList.length / 2);
			ssmlParts.push(generatessml(filteredTextList.slice(0, midpoint)));
			ssmlParts.push(generatessml(filteredTextList.slice(midpoint)));
	    } else {
	    	ssmlParts.push(trialssml);
	    }

		function getMode() {
		  if (hkl) return "hkl";
		  if (elo) return "elo";
		  return "normal";
		}
		const mode = getMode();
		const intro = generateIntro(mode);
		const outro = generateOutro(mode);

		ssmlParts[0] = intro + ssmlParts[0];
		
		if (ssmlParts.length === 1) {
			//if one part,
			
			ssmlParts[0] = '<speak>' + ssmlParts[0];
			ssmlParts[0] += outro;
			ssmlParts[0] += '</speak>';
			
			console.log("one part");
			console.log(ssmlParts[0]);
			console.log("LENGTH:", ssmlParts[0].length);
			
			sendTTS(ssmlParts[0], function (audioUrl) {
				document.getElementById("audio").src = audioUrl;
				document.getElementById("audio").play();
				document.getElementById("speakButton").innerHTML = "⟶speak";
			});
		} else {
			//if two parts,
			
			ssmlParts[0] = '<speak>' + ssmlParts[0];
			ssmlParts[0] += ' this workout has been split into two parts. please play the second part now. ';
			ssmlParts[0] += '</speak>';
			ssmlParts[1] = '<speak>' + ' here is the second part of your workout. ' + ssmlParts[1];
			ssmlParts[1] += outro;
			ssmlParts[1] += '</speak>';
			
			console.log("two parts");
			console.log(ssmlParts[0]);
			console.log("LENGTH:", ssmlParts[0].length);
			
			console.log(ssmlParts[1]);
			console.log("LENGTH:", ssmlParts[1].length);
				
	        sendTTS(ssmlParts[0], function (audioUrl) {
	            document.getElementById("audio").src = audioUrl;
	            document.getElementById("audio").play();
	        });

	        sendTTS(ssmlParts[1], function (audioUrl2) {
	            injectSecondPlayer(audioUrl2);
	            document.getElementById("speakButton").innerHTML = "⟶speak";
	        });
	    }
	}
	
	// send it off to the tts mines
	function sendTTS(ssmlChunk, callback) {
	    var xhr = new XMLHttpRequest();
	    var url = "https://texttospeech.googleapis.com/v1/text:synthesize?key=AIzaSyCcCQFbNls8ogpWJTshCm2ZTQLnx1x3tzE";

	    xhr.open("POST", url, true);
	    xhr.setRequestHeader("Content-Type", "application/json");

	    xhr.onreadystatechange = function () {
	        if (xhr.readyState === 4 && xhr.status === 200) {
	            var response = JSON.parse(xhr.responseText);
	            var audioUrl = "data:audio/mp3;base64," + response.audioContent;
	            callback(audioUrl);
	        }
	    };

	    var data = JSON.stringify({
	        input: { ssml: ssmlChunk },
	        voice: { languageCode: "en-US", "name": "en-US-Studio-O", ssmlGender: "FEMALE" },
	        audioConfig: { audioEncoding: "MP3" }
	    });

	    xhr.send(data);
	}
	
	// second player if needed
	function injectSecondPlayer(audioUrl2) {

	    const old = document.getElementById("audio2");
	    if (old) old.parentNode.remove();

	    const container = document.createElement("div");
	    container.style.display = "flex";

	    const audio2 = document.createElement("audio");
	    audio2.id = "audio2";
	    audio2.controls = true;
	    audio2.src = audioUrl2;

	    const label = document.createElement("div");
	    label.textContent = "part 2:";
		label.classList.add("audiohelper"); 

	    container.appendChild(label);
	    container.appendChild(audio2);

	    const originalBlock = document.getElementById("audio").parentNode;
	    originalBlock.insertAdjacentElement("afterend", container);
	}

	// make ssml for the robot to speak
	function generatessml(filteredTextList){

		let ssml = '<break time="1"/>';

		filteredTextList.forEach((item, index) => {

			const checkbox = item;
			const text = item.nextSibling.textContent.trim();
			const exercisetime = checkbox.dataset.time;
			const bothsides = checkbox.dataset.bothsides;
			const reps = checkbox.dataset.reps;
			const recover = checkbox.dataset.recover;
			var getreadystring = '';
			var reststring = '';
			
			// if this isn't the last exercise,
			if(filteredTextList[index+1] !== undefined){
				var nextexercise = filteredTextList[index+1].nextSibling.textContent.trim();
				getreadystring = `get ready for ${nextexercise}. <break time="3s"/>`
				reststring = `rest for ${recover} seconds. the next exercise is ${nextexercise}. <break time="${recover}s"/> `
			}
			
			function recovery(){
				// if this isn't the last exercise,
				if(filteredTextList[index+1] !== undefined){
					ssml += reststring;
					ssml += getreadystring;
				}
			}

			if (reps>1){
				if (bothsides === 'y'){
					ssml += `${text}, first side. <break time="1s"/> `
					for (i=0;i<reps;i++){
						ssml += ` ${i+1} <break time="${exercisetime}s"/> `
					}
			        if (!elo){
						ssml += `${text}, other side. <break time="1s"/> `
					}else{
						ssml += `now it's time to switch to the other side. <break time="1s"/> ` + `${text}, other side. <break time="1s"/> `;
					}
					for (i=0;i<reps;i++){
						ssml += ` ${i+1} <break time="${exercisetime}s"/> `
					}
					if (recover > 0){
						recovery();
					}
				}
				else{
					ssml += `${text} <break time="1s"/> `;
					for (i=0;i<reps;i++){
						ssml += ` ${i+1} <break time="${exercisetime}s"/> `
					}
					if (recover > 0){
						recovery();
					}
				}
			}
			else {
			    if (bothsides === 'y') {
					ssml += text + `, first side, ${exercisetime} seconds. <break time="${exercisetime}s"/> `;
			        if (!elo){
						ssml += text + `, other side, ${exercisetime} seconds. <break time="${exercisetime}s"/> `;
					}else{
						ssml += `now it's time to switch to the other side. <break time="1s"/> ` + text + `, other side, ${exercisetime} seconds. <break time="${exercisetime}s"/> `;
					}
					if (recover > 0){
						recovery();
					}
			    } else {
			        ssml += text + `, ${exercisetime} seconds. <break time="${exercisetime}s"/>`;
					if (recover > 0){
						recovery();
					}
			    }
			}

		});

		return ssml;
	}

	// estimate time it takes to read any given ssml
	function estimateReadingTime(ssml) {

	    const wordsPerSecond = 2.5;

	    const textContent = ssml.replace(/<[^>]*>/g, '');
	    const wordCount = textContent.split(/\s+/).filter(word => word.length > 0).length;

	    let estimatedTime = wordCount / wordsPerSecond;

	    const breakTimes = ssml.match(/<break[^>]*time="([\d.]+)s"[^>]*>/g) || [];
	    breakTimes.forEach(breakTag => {
	        const match = breakTag.match(/time="([\d.]+)s"/);
	        if (match && match[1]) {
	            estimatedTime += parseFloat(match[1]);
	        }
	    });

	    return estimatedTime;
	}

</script>

</body>
</html>
