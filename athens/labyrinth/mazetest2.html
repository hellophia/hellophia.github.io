<html>
<head>
	<style>
		.mazeholder {
		    display: grid;
		    grid-template-columns: repeat(5, 60px);
		    grid-template-rows: repeat(5, 60px);
		    width: fit-content;
		}
		
		.cell {
		    box-sizing: border-box;

		    width: 60px;
		    height: 60px;

		    border-top: 6px solid black;
		    border-right: 6px solid black;
		    border-bottom: 6px solid black;
		    border-left: 6px solid black;

		    background: white;
		}
		
		.cell.north {
		    border-top: none;
		}

		.cell.east {
		    border-right: none;
		}

		.cell.south {
		    border-bottom: none;
		}

		.cell.west {
		    border-left: none;
		}
		
		.cell.current {
		    background: yellow;
			position: relative;
		}
		
		.cell.current::after {
		    position: absolute;
		    top: 50%;
		    left: 50%;
		    transform: translate(-50%, -50%);
		    font-size: 42px;
		}
		
		.cell.current.face-n::after {
			content: "↑";
		}

		.cell.current.face-e::after {
			content: "→";
		}

		.cell.current.face-s::after {
			content: "↓";
		}

		.cell.current.face-w::after {
			content: "←";
		}

		.controls {
		    margin-top: 20px;
		}

		button {
		    margin-right: 10px;
		}
		
		</style>
</head>
<body>

	<div class="mazeholder"></div>
	
	<script>
		
		const maze = {
		    "1,1":["E","S"],
		    "2,1":["W","S"],
			"3,1":["N","E"],
			"4,1":["E","W"],
			"5,1":["W","S"],

		    "1,2":["N","S"],
		    "2,2":["N","E"],
		    "3,2":["W"],
			"4,2":["E","S"],
			"5,2":["N","S","W"],

		    "1,3":["N","E","S"],
		    "2,3":["W","E"],
		    "3,3":["W","E"],
			"4,3":["N","W"],
			"5,3":["N","S"],

		    "1,4":["S","N"],
		    "2,4":["S","E"],
			"3,4":["S","W","E"],
			"4,4":["S","W"],
			"5,4":["N"],

		    "1,5":["N","E"],
		    "2,5":["W","N"],
			"3,5":["N","S"],
		    "4,5":["N","E"],
		    "5,5":["W"]
		};

		const holder = document.querySelector(".mazeholder");

		for (let y = 1; y <= 5; y++) {
		    for (let x = 1; x <= 5; x++) {

		        const key = `${x},${y}`;

		        const cell = document.createElement("div");
		        cell.classList.add("cell");
				
				cell.dataset.x = x;
				cell.dataset.y = y;

		        if (maze[key]) {

		            maze[key].forEach(dir => {
		                switch(dir) {
		                    case "N":
		                        cell.classList.add("north");
		                        break;
		                    case "E":
		                        cell.classList.add("east");
		                        break;
		                    case "S":
		                        cell.classList.add("south");
		                        break;
		                    case "W":
		                        cell.classList.add("west");
		                        break;
		                }
		            });

		        } else {
		            cell.classList.add("void");
		        }

		        holder.appendChild(cell);
		    }
		}
		
		updateDisplay();
		
		</script>
</body>
</html>
